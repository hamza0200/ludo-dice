<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Dice</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --text: #eee;
    --text-dim: #8892b0;
    --red: #e74c3c;
    --yellow: #f1c40f;
    --green: #2ecc71;
    --blue: #3498db;
    --orange: #e67e22;
    --purple: #9b59b6;
    --glow: rgba(255,255,255,0.05);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(231,76,60,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(52,152,219,0.06) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(46,204,113,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .container {
    width: 100%;
    max-width: 560px;
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 2.4rem;
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--red), var(--yellow), var(--green), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 32px;
    letter-spacing: 0.3px;
  }

  /* ── Setup Screen ── */
  #setup {
    background: var(--surface);
    border-radius: 20px;
    padding: 32px 28px;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .field { margin-bottom: 24px; }

  .field label {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    display: block;
    margin-bottom: 10px;
  }

  .option-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .option-btn {
    flex: 1;
    min-width: 56px;
    padding: 12px 8px;
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Fredoka', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .option-btn:hover { border-color: rgba(255,255,255,0.25); background: var(--surface2); }
  .option-btn.active { border-color: var(--blue); background: var(--surface2); box-shadow: 0 0 16px rgba(52,152,219,0.25); }

  .start-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    color: #fff;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.5px;
    margin-top: 8px;
  }

  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(52,152,219,0.3); }

  /* ── Game Screen ── */
  #game { display: none; text-align: center; }

  .players-bar {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .player-chip {
    padding: 8px 16px;
    border-radius: 30px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    color: #fff;
    opacity: 0.35;
    transition: all 0.4s;
    border: 2px solid transparent;
    position: relative;
  }

  .player-chip.active {
    opacity: 1;
    transform: scale(1.1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .player-chip.active::after {
    content: '▼';
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    animation: bounce 0.8s ease infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-4px); }
  }

  /* ── Dice Area ── */
  .dice-zone {
    display: flex;
    gap: 24px;
    justify-content: center;
    align-items: center;
    margin: 20px 0 24px;
    min-height: 140px;
  }

  .dice-wrapper { perspective: 600px; }

  .dice {
    width: 100px;
    height: 100px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.15s;
  }

  .dice.rolling {
    animation: diceRoll 0.6s ease-out;
  }

  @keyframes diceRoll {
    0%   { transform: rotateX(0)   rotateY(0)   rotateZ(0)   scale(0.8); }
    20%  { transform: rotateX(240deg) rotateY(180deg) rotateZ(90deg) scale(1.1); }
    40%  { transform: rotateX(480deg) rotateY(360deg) rotateZ(180deg) scale(0.95); }
    60%  { transform: rotateX(600deg) rotateY(500deg) rotateZ(240deg) scale(1.05); }
    80%  { transform: rotateX(700deg) rotateY(680deg) rotateZ(300deg) scale(1); }
    100% { transform: rotateX(720deg) rotateY(720deg) rotateZ(360deg) scale(1); }
  }

  .dice-face {
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 16px;
    display: grid;
    padding: 16px;
    backface-visibility: hidden;
  }

  .dice-face.f1 { background: linear-gradient(145deg, #fff 0%, #e8e8e8 100%); transform: rotateY(0deg)   translateZ(50px); }
  .dice-face.f2 { background: linear-gradient(145deg, #fff 0%, #e8e8e8 100%); transform: rotateY(180deg) translateZ(50px); }
  .dice-face.f3 { background: linear-gradient(145deg, #fff 0%, #e8e8e8 100%); transform: rotateX(90deg)  translateZ(50px); }
  .dice-face.f4 { background: linear-gradient(145deg, #fff 0%, #e8e8e8 100%); transform: rotateX(-90deg) translateZ(50px); }
  .dice-face.f5 { background: linear-gradient(145deg, #fff 0%, #e8e8e8 100%); transform: rotateY(90deg)  translateZ(50px); }
  .dice-face.f6 { background: linear-gradient(145deg, #fff 0%, #e8e8e8 100%); transform: rotateY(-90deg) translateZ(50px); }

  /* Dot layouts */
  .dice-face.f1 { grid-template: 1fr / 1fr; place-items: center; }
  .dice-face.f2 { grid-template: 1fr 1fr / 1fr; }
  .dice-face.f2 .dot:nth-child(1) { justify-self: end; align-self: start; }
  .dice-face.f2 .dot:nth-child(2) { justify-self: start; align-self: end; }
  .dice-face.f3 { grid-template: 1fr 1fr 1fr / 1fr; }
  .dice-face.f3 .dot:nth-child(1) { justify-self: end; align-self: start; }
  .dice-face.f3 .dot:nth-child(2) { justify-self: center; align-self: center; }
  .dice-face.f3 .dot:nth-child(3) { justify-self: start; align-self: end; }
  .dice-face.f4 { grid-template: 1fr 1fr / 1fr 1fr; place-items: center; }
  .dice-face.f5 { grid-template: 1fr 1fr 1fr / 1fr 1fr 1fr; }
  .dice-face.f5 .dot:nth-child(1) { grid-area: 1/1; justify-self: start; align-self: start; }
  .dice-face.f5 .dot:nth-child(2) { grid-area: 1/3; justify-self: end; align-self: start; }
  .dice-face.f5 .dot:nth-child(3) { grid-area: 2/2; justify-self: center; align-self: center; }
  .dice-face.f5 .dot:nth-child(4) { grid-area: 3/1; justify-self: start; align-self: end; }
  .dice-face.f5 .dot:nth-child(5) { grid-area: 3/3; justify-self: end; align-self: end; }
  .dice-face.f6 { grid-template: 1fr 1fr 1fr / 1fr 1fr; place-items: center; }

  .dot {
    width: 16px;
    height: 16px;
    background: #2c3e50;
    border-radius: 50%;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.3);
  }

  /* ── Result display ── */
  .result-number {
    font-family: 'Fredoka', sans-serif;
    font-size: 3.2rem;
    font-weight: 700;
    min-height: 56px;
    margin-bottom: 4px;
    transition: color 0.3s;
  }

  .result-label {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 20px;
    min-height: 22px;
  }

  .six-alert {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 10px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 16px;
    animation: alertPop 0.35s ease;
    min-height: 40px;
  }

  .six-alert.bonus {
    background: rgba(46,204,113,0.15);
    color: var(--green);
    border: 1px solid rgba(46,204,113,0.3);
  }

  .six-alert.penalty {
    background: rgba(231,76,60,0.15);
    color: var(--red);
    border: 1px solid rgba(231,76,60,0.3);
  }

  @keyframes alertPop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .roll-btn {
    width: 100%;
    max-width: 320px;
    padding: 18px 32px;
    border: none;
    border-radius: 16px;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
  }

  .roll-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 50%);
    pointer-events: none;
  }

  .roll-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.4); }
  .roll-btn:active:not(:disabled) { transform: translateY(0); }
  .roll-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .roll-hint {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 10px;
  }

  .roll-hint kbd {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 5px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
  }

  /* ── History log ── */
  .history {
    margin-top: 24px;
    background: var(--surface);
    border-radius: 14px;
    padding: 16px;
    max-height: 180px;
    overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.05);
    text-align: left;
  }

  .history h3 {
    font-family: 'Fredoka', sans-serif;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .history-entry {
    font-size: 0.8rem;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: slideIn 0.3s ease;
  }

  .history-entry:last-child { border: none; }

  .history-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .history::-webkit-scrollbar { width: 4px; }
  .history::-webkit-scrollbar-track { background: transparent; }
  .history::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  /* ── Particles ── */
  .particle {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    animation: particleFly 0.8s ease-out forwards;
    z-index: 100;
  }

  @keyframes particleFly {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0) translateY(-80px); }
  }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    h1 { font-size: 1.8rem; }
    .dice { width: 80px; height: 80px; }
    .dice-face { width: 80px; height: 80px; padding: 12px; border-radius: 12px; }
    .dice-face.f1 { transform: rotateY(0deg) translateZ(40px); }
    .dice-face.f2 { transform: rotateY(180deg) translateZ(40px); }
    .dice-face.f3 { transform: rotateX(90deg) translateZ(40px); }
    .dice-face.f4 { transform: rotateX(-90deg) translateZ(40px); }
    .dice-face.f5 { transform: rotateY(90deg) translateZ(40px); }
    .dice-face.f6 { transform: rotateY(-90deg) translateZ(40px); }
    .dot { width: 12px; height: 12px; }
    .result-number { font-size: 2.4rem; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Ludo Dice</h1>
  <p class="subtitle">Roll the dice & play fair</p>

  <!-- Setup -->
  <div id="setup">
    <div class="field">
      <label>How many players?</label>
      <div class="option-group" id="playerOpts">
        <button class="option-btn active" data-val="2">2</button>
        <button class="option-btn" data-val="3">3</button>
        <button class="option-btn" data-val="4">4</button>
        <button class="option-btn" data-val="5">5</button>
        <button class="option-btn" data-val="6">6</button>
      </div>
    </div>
    <div class="field">
      <label>How many dice?</label>
      <div class="option-group" id="diceOpts">
        <button class="option-btn active" data-val="1">1</button>
        <button class="option-btn" data-val="2">2</button>
      </div>
    </div>
    <button class="start-btn" id="startBtn">Start Game</button>
  </div>

  <!-- Game -->
  <div id="game">
    <div class="players-bar" id="playersBar"></div>
    <div class="dice-zone" id="diceZone"></div>
    <div class="result-number" id="resultNum"></div>
    <div class="result-label" id="resultLabel"></div>
    <div id="alertBox"></div>
    <button class="roll-btn" id="rollBtn">Roll Dice</button>
    <div class="roll-hint"><kbd>Space</kbd> or <kbd>Enter</kbd> to roll</div>
    <div class="history" id="history"><h3>Roll History</h3></div>
  </div>
</div>

<script>
// ── Audio Engine (Web Audio API) ──
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playDiceSound() {
  ensureAudio();
  const now = audioCtx.currentTime;

  // Multiple short noise bursts to simulate dice rattling
  for (let i = 0; i < 6; i++) {
    const t = now + i * 0.07 + Math.random() * 0.03;
    const dur = 0.04 + Math.random() * 0.03;

    const bufSize = audioCtx.sampleRate * dur;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let j = 0; j < bufSize; j++) {
      data[j] = (Math.random() * 2 - 1) * 0.35;
    }

    const src = audioCtx.createBufferSource();
    src.buffer = buf;

    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1800 + Math.random() * 2500;
    bp.Q.value = 1.5;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + dur);

    src.connect(bp).connect(gain).connect(audioCtx.destination);
    src.start(t);
    src.stop(t + dur);
  }

  // Landing thud
  const thudTime = now + 0.5;
  const thudBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
  const thudData = thudBuf.getChannelData(0);
  for (let j = 0; j < thudData.length; j++) {
    thudData[j] = (Math.random() * 2 - 1) * 0.5 * Math.exp(-j / (thudData.length * 0.15));
  }
  const thudSrc = audioCtx.createBufferSource();
  thudSrc.buffer = thudBuf;
  const thudFilter = audioCtx.createBiquadFilter();
  thudFilter.type = 'lowpass';
  thudFilter.frequency.value = 600;
  const thudGain = audioCtx.createGain();
  thudGain.gain.value = 0.6;
  thudSrc.connect(thudFilter).connect(thudGain).connect(audioCtx.destination);
  thudSrc.start(thudTime);
}

function playSixSound() {
  ensureAudio();
  const now = audioCtx.currentTime;
  [523, 659, 784].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, now + i * 0.1);
    g.gain.linearRampToValueAtTime(0.2, now + i * 0.1 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.3);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(now + i * 0.1);
    osc.stop(now + i * 0.1 + 0.3);
  });
}

function playErrorSound() {
  ensureAudio();
  const now = audioCtx.currentTime;
  [350, 280].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.15, now + i * 0.15);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.25);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(now + i * 0.15);
    osc.stop(now + i * 0.15 + 0.25);
  });
}

// ── Config ──
const COLORS = [
  { name: 'Red',    hex: '#e74c3c', var: 'var(--red)' },
  { name: 'Yellow', hex: '#f1c40f', var: 'var(--yellow)' },
  { name: 'Green',  hex: '#2ecc71', var: 'var(--green)' },
  { name: 'Blue',   hex: '#3498db', var: 'var(--blue)' },
  { name: 'Orange', hex: '#e67e22', var: 'var(--orange)' },
  { name: 'Purple', hex: '#9b59b6', var: 'var(--purple)' },
];

let numPlayers = 2;
let numDice = 1;
let currentPlayer = 0;
let consecutiveSixes = 0;
let isRolling = false;

// ── Setup selection ──
document.querySelectorAll('.option-group').forEach(group => {
  group.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      group.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
});

document.getElementById('startBtn').addEventListener('click', startGame);

function startGame() {
  numPlayers = parseInt(document.querySelector('#playerOpts .active').dataset.val);
  numDice = parseInt(document.querySelector('#diceOpts .active').dataset.val);
  currentPlayer = 0;
  consecutiveSixes = 0;

  document.getElementById('setup').style.display = 'none';
  document.getElementById('game').style.display = 'block';

  buildPlayers();
  buildDice();
  updatePlayerHighlight();
  document.getElementById('rollBtn').focus();
}

function buildPlayers() {
  const bar = document.getElementById('playersBar');
  bar.innerHTML = '';
  for (let i = 0; i < numPlayers; i++) {
    const chip = document.createElement('div');
    chip.className = 'player-chip';
    chip.style.background = COLORS[i].hex;
    chip.textContent = COLORS[i].name;
    chip.id = `chip-${i}`;
    bar.appendChild(chip);
  }
}

function buildDice() {
  const zone = document.getElementById('diceZone');
  zone.innerHTML = '';
  for (let d = 0; d < numDice; d++) {
    const wrapper = document.createElement('div');
    wrapper.className = 'dice-wrapper';
    const dice = document.createElement('div');
    dice.className = 'dice';
    dice.id = `dice-${d}`;

    // Build all 6 faces
    for (let f = 1; f <= 6; f++) {
      const face = document.createElement('div');
      face.className = `dice-face f${f}`;
      for (let dot = 0; dot < f; dot++) {
        const d2 = document.createElement('div');
        d2.className = 'dot';
        face.appendChild(d2);
      }
      dice.appendChild(face);
    }

    wrapper.appendChild(dice);
    zone.appendChild(wrapper);
  }
}

function updatePlayerHighlight() {
  for (let i = 0; i < numPlayers; i++) {
    const chip = document.getElementById(`chip-${i}`);
    chip.classList.toggle('active', i === currentPlayer);
  }
  const btn = document.getElementById('rollBtn');
  btn.style.background = `linear-gradient(135deg, ${COLORS[currentPlayer].hex}, ${adjustColor(COLORS[currentPlayer].hex, -30)})`;
}

function adjustColor(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, Math.min(255, r + amt));
  g = Math.max(0, Math.min(255, g + amt));
  b = Math.max(0, Math.min(255, b + amt));
  return `rgb(${r},${g},${b})`;
}

// ── Dice rotation for showing specific face ──
function getRotation(value) {
  const map = {
    1: 'rotateX(0deg) rotateY(0deg)',
    2: 'rotateX(0deg) rotateY(180deg)',
    3: 'rotateX(-90deg) rotateY(0deg)',
    4: 'rotateX(90deg) rotateY(0deg)',
    5: 'rotateX(0deg) rotateY(-90deg)',
    6: 'rotateX(0deg) rotateY(90deg)',
  };
  return map[value];
}

// ── Roll ──
function rollDice() {
  if (isRolling) return;
  isRolling = true;
  ensureAudio();

  const btn = document.getElementById('rollBtn');
  btn.disabled = true;

  document.getElementById('alertBox').innerHTML = '';

  playDiceSound();

  const results = [];
  for (let d = 0; d < numDice; d++) {
    const val = Math.floor(Math.random() * 6) + 1;
    results.push(val);
    const diceEl = document.getElementById(`dice-${d}`);
    diceEl.classList.remove('rolling');
    void diceEl.offsetWidth; // reflow
    diceEl.classList.add('rolling');

    setTimeout(() => {
      diceEl.classList.remove('rolling');
      // Add random full rotations + the target face
      const extraX = 720;
      const extraY = 720;
      diceEl.style.transform = getRotation(val);
    }, 600);
  }

  setTimeout(() => {
    const total = results.reduce((a, b) => a + b, 0);
    const allSixes = results.every(v => v === 6);

    document.getElementById('resultNum').textContent = total;
    document.getElementById('resultNum').style.color = COLORS[currentPlayer].hex;

    const diceStr = results.length > 1 ? results.join(' + ') : '';
    document.getElementById('resultLabel').textContent = diceStr ? `(${diceStr})` : '';

    // Log
    addHistory(currentPlayer, results, total);

    // Particles
    spawnParticles(COLORS[currentPlayer].hex);

    if (allSixes) {
      consecutiveSixes++;
      if (consecutiveSixes >= 3) {
        // Triple six penalty
        playErrorSound();
        const alert = document.getElementById('alertBox');
        alert.innerHTML = `<div class="six-alert penalty">Triple 6! ${COLORS[currentPlayer].name} can't move — turn passes.</div>`;
        consecutiveSixes = 0;
        nextPlayer();
      } else {
        playSixSound();
        const alert = document.getElementById('alertBox');
        alert.innerHTML = `<div class="six-alert bonus">🎉 Rolled a 6! Roll again!</div>`;
        // Same player rolls again
      }
    } else {
      consecutiveSixes = 0;
      nextPlayer();
    }

    isRolling = false;
    btn.disabled = false;
    btn.focus();
  }, 700);
}

function nextPlayer() {
  currentPlayer = (currentPlayer + 1) % numPlayers;
  consecutiveSixes = 0;
  setTimeout(updatePlayerHighlight, 50);
}

function addHistory(player, results, total) {
  const hist = document.getElementById('history');
  const entry = document.createElement('div');
  entry.className = 'history-entry';
  entry.innerHTML = `
    <span class="history-dot" style="background:${COLORS[player].hex}"></span>
    <span><strong>${COLORS[player].name}</strong> rolled <strong>${total}</strong>${results.length > 1 ? ` (${results.join(', ')})` : ''}</span>
  `;
  // Insert after the h3
  const h3 = hist.querySelector('h3');
  if (h3.nextSibling) {
    hist.insertBefore(entry, h3.nextSibling);
  } else {
    hist.appendChild(entry);
  }
}

function spawnParticles(color) {
  const zone = document.querySelector('.dice-zone');
  const rect = zone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 4 + Math.random() * 8;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.background = color;
    p.style.left = (cx + (Math.random() - 0.5) * 80) + 'px';
    p.style.top = (cy + (Math.random() - 0.5) * 80) + 'px';
    p.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
}

// ── Controls ──
document.getElementById('rollBtn').addEventListener('click', rollDice);

document.addEventListener('keydown', (e) => {
  if (document.getElementById('game').style.display === 'none') {
    if (e.key === 'Enter') {
      document.getElementById('startBtn').click();
    }
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    rollDice();
  }
});
</script>
</body>
</html>
